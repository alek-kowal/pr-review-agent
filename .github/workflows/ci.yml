name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pra
          POSTGRES_PASSWORD: pra
          POSTGRES_DB: pra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pra -d pra_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # CI-only throwaway credentials. Tests create and drop their own `pra_test_<run>` databases
      # through `pra_test`.
      DATABASE_URL: postgres://pra:pra@localhost:5432/pra_test
      # MinIO for the S3BlobStore contract tests (started below).
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # A step, not a service: service containers cannot pass the `server /data` arguments.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pra -e MINIO_ROOT_PASSWORD=pra-local-only \
            --tmpfs /data cgr.dev/chainguard/minio:latest server /data

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pra
          POSTGRES_PASSWORD: pra
          POSTGRES_DB: pra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pra -d pra_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # CI-only throwaway credentials. The e2e stack creates and drops its own `pra_test_<run>`
      # database through `pra_test` (e2e/support/stack.ts).
      DATABASE_URL: postgres://pra:pra@localhost:5432/pra_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
