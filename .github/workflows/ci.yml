name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pra
          POSTGRES_PASSWORD: pra
          POSTGRES_DB: pra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pra -d pra_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # CI-only throwaway credentials. Tests create and drop their own `pra_test_<run>` databases
      # through `pra_test`.
      DATABASE_URL: postgres://pra:pra@localhost:5432/pra_test
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
