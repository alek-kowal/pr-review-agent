<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WB Factory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@500;600&display=swap">
<script>
/* Theme before first paint: explicit choice only; "system" sets nothing. */
(function(){try{var t=localStorage.getItem('wbf.theme');if(t==='"dark"'||t==='"light"')document.documentElement.setAttribute('data-theme',JSON.parse(t));}catch(e){}})();
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
  theme: {
    fontFamily: {
      sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
      head: ['Poppins', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
      mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
    },
    fontSize: {
      '2xs': ['11px', '14px'], xs: ['12px', '16px'], sm: ['13px', '18px'], base: ['14px', '20px'],
      md: ['15px', '22px'], lg: ['17px', '24px'], xl: ['20px', '28px'], '2xl': ['24px', '32px']
    },
    extend: {
      colors: {
        bg: 'var(--bg)', surface: 'var(--surface)', inset: 'var(--inset)', sunk: 'var(--surface-2)',
        line: 'var(--border)', div: 'var(--divider)',
        ink: 'var(--text)', ink2: 'var(--text-2)', ink3: 'var(--text-3)', ink4: 'var(--text-4)',
        brand: 'var(--brand)', brandt: 'var(--brand-text)', brandbg: 'var(--brand-bg)',
        ok: 'var(--ok)', okbg: 'var(--ok-bg)', warn: 'var(--warn)', warnbg: 'var(--warn-bg)',
        bad: 'var(--bad)', badbg: 'var(--bad-bg)'
      },
      borderRadius: { DEFAULT: '6px', md: '6px', lg: '8px', xl: '12px' }
    }
  }
};
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/preact@10.24.3/dist/preact.umd.js"></script>
<script src="https://unpkg.com/preact@10.24.3/hooks/dist/hooks.umd.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
<script src="js/shell.js"></script>
<script src="js/board.js"></script>
<script src="js/pr.js"></script>
<script src="js/findings.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/pages.js"></script>
<script src="js/settings.js"></script>
<script src="js/settings2.js"></script>
<script src="js/guide.js"></script>
<script src="js/metrics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
